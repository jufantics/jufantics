<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Reparando JUFANTICS</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f3fb;color:#17345a;font-family:Arial,sans-serif}
    main{width:min(560px,calc(100% - 40px));padding:36px;border-radius:24px;background:#fff;box-shadow:0 18px 60px #27345a22;text-align:center}
    h1{font-family:Georgia,serif;font-size:2rem;margin:.4rem 0 1rem}p{line-height:1.6}.spinner{width:54px;height:54px;margin:auto;border:7px solid #eee7fb;border-top-color:#6c46bd;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    a{display:none;margin-top:20px;padding:13px 18px;border-radius:14px;background:#17345a;color:#fff;font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Reparando JUFANTICS</h1>
    <p id="status">Eliminando únicamente los archivos antiguos de la aplicación. Tu cuenta familiar y tus perfiles se conservarán.</p>
    <a id="continue" href="index.html?version=20261112-1#biblioteca">Continuar a la biblioteca</a>
  </main>
  <script>
    (async()=>{
      const status=document.getElementById('status'),button=document.getElementById('continue');
      try{
        if('serviceWorker' in navigator){
          const registrations=await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration=>registration.unregister()));
        }
        if('caches' in window){
          const names=await caches.keys();
          await Promise.all(names.filter(name=>name.startsWith('jufantics-')).map(name=>caches.delete(name)));
        }
        status.textContent='Reparación completada. Abriendo la biblioteca actualizada…';
        location.replace(`index.html?version=20261112-1&fresh=${Date.now()}#biblioteca`);
      }catch(error){
        status.textContent='La limpieza automática terminó parcialmente. Pulsa el botón para continuar.';
        button.style.display='inline-block';
      }
    })();
  </script>
</body>
</html>
