<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#122746">
  <title>Lector JUFANTICS</title>
  <link rel="stylesheet" href="lector-cuento.css">
</head>
<body>
  <div class="story-background" aria-hidden="true"></div>
  <header class="reader-head">
    <a class="brand" href="index.html#biblioteca"><img src="logo.jpg" alt=""><span>JUFANTICS</span></a>
    <div class="reader-title"><small id="storyGenre">Cuento propio</small><h1 id="storyTitle">Cargando historia…</h1></div>
    <a class="back" href="index.html#biblioteca">← Biblioteca</a>
  </header>
  <main class="reader-shell">
    <div class="stage">
      <button class="turn" id="prevPage" type="button" aria-label="Página anterior">‹</button>
      <figure class="page-wrap">
        <img id="pageImage" src="" alt="" draggable="false">
        <figcaption><span id="pageLabel">Página</span><span id="pageProgress"></span></figcaption>
      </figure>
      <button class="turn" id="nextPage" type="button" aria-label="Página siguiente">›</button>
    </div>
    <section class="reader-controls" aria-label="Controles de lectura">
      <button id="listenPage" type="button">🔊 Narración suave</button>
      <button id="stopVoice" type="button">■ Detener</button>
      <label>Página <input id="pageNumber" type="number" min="1" value="1"></label>
      <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
    </section>
    <aside class="jufantico-note">
      <img src="jufantico_canon.png" alt="Jufántico">
      <div><strong>Lee a tu ritmo o escucha conmigo</strong><p id="readerStatus" aria-live="polite">Preparando una voz suave en español.</p></div>
      <a class="activity-link" id="activityLink" href="experiencias.html">✨ Al terminar</a>
    </aside>
  </main>
  <div class="jufantico-orb" aria-hidden="true"><img src="jufantico_canon.png" alt=""><span>Jufántico acompaña</span></div>
  <script src="voice-latina.js"></script>
  <script src="lector-cuento.js?v=20261029-final"></script>
</body>
</html>
