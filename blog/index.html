<style>
:root{
  --sky:#5AABCF;--skyl:#E8F5FB;--nar:#E8936A;--narl:#FBF0EB;
  --lav:#9B8EC4;--lavl:#EDEAFF;--ink:#1C1528;--ink2:#4A3F5C;--ink3:#8A7FA0;
  --bg:#FAF6F0;--bg2:#F2EDE3;--bg3:#EDE3D6;
  --r:14px;--sh:0 4px 24px rgba(28,21,40,.09);--sh2:0 16px 56px rgba(28,21,40,.18);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;line-height:1.6}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1100px;margin:0 auto;padding:0 5%}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}

.btn-p{display:inline-flex;align-items:center;gap:.45rem;font-family:'Nunito',sans-serif;font-weight:800;font-size:.88rem;padding:.78rem 1.7rem;border-radius:50px;border:none;cursor:pointer;text-decoration:none;background:var(--nar);color:#fff;transition:transform .2s,background .2s}
.btn-p:hover{background:#d4783e;transform:translateY(-2px)}
.btn-s{display:inline-flex;align-items:center;gap:.45rem;font-family:'Nunito',sans-serif;font-weight:800;font-size:.88rem;padding:.78rem 1.7rem;border-radius:50px;border:2px solid rgba(28,21,40,.18);cursor:pointer;text-decoration:none;background:transparent;color:var(--ink);transition:transform .2s,border-color .2s,color .2s}
.btn-s:hover{border-color:var(--lav);color:var(--lav);transform:translateY(-2px)}

.wa-fab{position:fixed;bottom:1.5rem;right:1.5rem;z-index:900;width:56px;height:56px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(37,211,102,.5);cursor:pointer;text-decoration:none}
.wa-fab svg{width:28px;height:28px;fill:white}

.nav{position:fixed;top:0;left:0;right:0;z-index:200;padding:.85rem 5%;display:flex;align-items:center;justify-content:space-between;transition:background .3s,box-shadow .3s}
.nav.solid{background:rgba(250,246,240,.97);backdrop-filter:blur(14px);box-shadow:0 2px 16px rgba(28,21,40,.08)}
.nav-brand{display:flex;align-items:center;gap:.52rem;text-decoration:none}
.nav-logo{height:34px;width:auto}
.nav-name{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.22rem;letter-spacing:-.4px;line-height:1;color:var(--ink)}
.nj1{color:var(--sky)}.nj2{color:var(--nar)}.nj3{color:var(--lav)}
.nav-tag{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.67rem;color:var(--ink3);line-height:1}
.nav-right{display:flex;align-items:center;gap:1rem}
.nav-back{display:inline-flex;align-items:center;gap:.4rem;font-family:'Nunito',sans-serif;font-weight:700;font-size:.76rem;color:var(--ink2);padding:.46rem 1rem;border-radius:50px;border:2px solid rgba(28,21,40,.15);transition:border-color .2s,color .2s}
.nav-back:hover{border-color:var(--lav);color:var(--lav)}
.nav-cta{background:var(--nar);color:#fff;padding:.46rem 1.15rem;border-radius:50px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.76rem;transition:background .2s}
.nav-cta:hover{background:#d4783e}

/* HERO */
.blog-hero{padding:9rem 5% 5rem;background:linear-gradient(145deg,var(--lavl) 0%,var(--bg) 55%,var(--narl) 100%);text-align:center;position:relative;overflow:hidden}
.blog-hero::before{content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:600px;height:400px;background:radial-gradient(ellipse,rgba(155,142,196,.18) 0%,transparent 70%);pointer-events:none}
/* imagen de portada del hero */
.blog-hero-img{width:100%;max-height:320px;object-fit:cover;border-radius:16px;margin:0 auto 2rem;box-shadow:var(--sh2);display:block}
.blog-eye{display:inline-flex;align-items:center;gap:.4rem;font-size:.71rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--lav);margin-bottom:1rem}
.blog-eye::before{content:'âœ¦'}
.blog-h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(2.2rem,5vw,3.5rem);line-height:1.15;color:var(--ink);margin-bottom:.9rem}
.blog-h1 em{font-style:italic;color:var(--lav)}
.blog-sub{font-size:1.05rem;color:var(--ink2);line-height:1.75;max-width:540px;margin:0 auto 2rem}
.blog-back{display:inline-flex;align-items:center;gap:.45rem;font-family:'Nunito',sans-serif;font-weight:700;font-size:.82rem;color:var(--ink2);padding:.52rem 1.1rem;border-radius:50px;background:white;box-shadow:var(--sh);border:1px solid var(--bg3);transition:color .2s,border-color .2s,transform .2s}
.blog-back:hover{color:var(--lav);border-color:var(--lav);transform:translateX(-3px)}

/* SECCIÃ“N */
.blog-sec{padding:4.5rem 0 6rem}

/* TARJETA DESTACADA */
.bc-featured{border-radius:18px;overflow:hidden;background:white;box-shadow:var(--sh);cursor:pointer;display:grid;grid-template-columns:1.1fr 1fr;transition:transform .35s cubic-bezier(.2,.8,.3,1),box-shadow .35s;margin-bottom:2.5rem}
.bc-featured:hover{transform:translateY(-8px);box-shadow:var(--sh2)}
.bc-featured .bcf-img{overflow:hidden;min-height:320px}
.bc-featured .bcf-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.bc-featured:hover .bcf-img img{transform:scale(1.05)}
.bcf-body{padding:2.5rem}
.bcf-body .bc-date{font-size:.74rem;color:var(--ink3);margin-bottom:.5rem}
.bcf-body .bc-cat{display:inline-block;font-family:'Nunito',sans-serif;font-weight:700;font-size:.64rem;letter-spacing:.5px;text-transform:uppercase;padding:.24rem .78rem;border-radius:50px;background:var(--lavl);color:var(--lav);margin-bottom:.9rem}
.bcf-body .bc-title{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.7rem;color:var(--ink);line-height:1.25;margin-bottom:.8rem}
.bcf-body .bc-excerpt{font-size:.94rem;color:var(--ink2);line-height:1.8;margin-bottom:1.4rem}
.bcf-body .bc-read{font-family:'Nunito',sans-serif;font-weight:700;font-size:.8rem;color:var(--nar);display:inline-flex;align-items:center;gap:.35rem}
.bcf-body .bc-read::after{content:'â†’';transition:transform .2s}
.bc-featured:hover .bc-read::after{transform:translateX(4px)}
.new-badge{display:inline-block;background:linear-gradient(90deg,var(--nar),#c4623e);color:white;font-family:'Nunito',sans-serif;font-weight:800;font-size:.6rem;letter-spacing:1px;text-transform:uppercase;padding:.2rem .65rem;border-radius:50px;margin-bottom:.6rem}

/* GRID 4 tarjetas */
.blog-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.8rem}
.bc{border-radius:16px;overflow:hidden;background:white;box-shadow:var(--sh);transition:transform .35s cubic-bezier(.2,.8,.3,1),box-shadow .35s;cursor:pointer}
.bc:hover{transform:translateY(-10px);box-shadow:var(--sh2)}
.bc-img{height:220px;overflow:hidden;position:relative}
.bc-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.bc:hover .bc-img img{transform:scale(1.06)}
.bc-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:4rem}
.bc-cat-badge{position:absolute;bottom:12px;left:12px;font-family:'Nunito',sans-serif;font-weight:700;font-size:.64rem;letter-spacing:.5px;text-transform:uppercase;padding:.24rem .78rem;border-radius:50px;background:white;color:var(--lav)}
.bc-body{padding:1.6rem}
.bc-date{font-size:.72rem;color:var(--ink3);margin-bottom:.45rem}
.bc-title{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.22rem;color:var(--ink);line-height:1.3;margin-bottom:.6rem}
.bc-excerpt{font-size:.88rem;color:var(--ink2);line-height:1.7;margin-bottom:1.1rem}
.bc-read{font-family:'Nunito',sans-serif;font-weight:700;font-size:.78rem;color:var(--nar);display:flex;align-items:center;gap:.35rem}
.bc-read::after{content:'â†’';transition:transform .2s}
.bc:hover .bc-read::after{transform:translateX(4px)}

/* PANELES OVERLAY */
.art-panel{display:none;position:fixed;inset:0;z-index:400;background:rgba(28,21,40,.55);overflow-y:auto;padding:2rem 1rem}
.art-panel.open{display:block}
.art-box{max-width:820px;margin:0 auto;background:white;border-radius:20px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.art-close-wrap{display:flex;justify-content:flex-end;padding:1rem 1.5rem 0}
.art-close{width:36px;height:36px;border-radius:50%;background:var(--bg2);border:none;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;line-height:1}
.art-close:hover{background:var(--bg3)}
/* imagen hero del artÃ­culo */
.art-hero-img{width:100%;height:300px;object-fit:cover;display:block}
.art-hero-ph{width:100%;height:220px;display:flex;align-items:center;justify-content:center;font-size:4.5rem}
/* imagen interna dentro del artÃ­culo */
.art-inner-img{width:100%;border-radius:12px;margin:1.5rem 0;object-fit:cover;max-height:340px;box-shadow:var(--sh)}
.art-content{padding:2.5rem 3rem 3rem}
.art-cat-badge{font-family:'Nunito',sans-serif;font-weight:700;font-size:.68rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--lav);background:var(--lavl);padding:.28rem .85rem;border-radius:50px;display:inline-block;margin-bottom:1rem}
.art-content h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(1.7rem,4vw,2.5rem);color:var(--ink);line-height:1.2;margin-bottom:.7rem}
.art-subtitle{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.15rem;color:var(--ink3);line-height:1.6;margin-bottom:1.5rem;padding-bottom:1.5rem;border-bottom:1px solid var(--bg3)}
.art-meta{display:flex;gap:1.5rem;font-size:.8rem;color:var(--ink3);margin-bottom:2rem;flex-wrap:wrap}
.art-content p{font-size:1.02rem;color:var(--ink2);line-height:1.9;margin-bottom:1.4rem}
.art-content h2{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.6rem;color:var(--ink);margin:2.2rem 0 .8rem;padding-bottom:.5rem;border-bottom:2px solid var(--lavl)}
.art-content h3{font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;color:var(--ink);margin:1.4rem 0 .5rem}
.art-content strong{color:var(--ink);font-weight:700}
.art-content em{font-style:italic;color:var(--lav)}
.art-content ul,.art-content ol{margin:0 0 1.4rem 1.5rem}
.art-content li{font-size:1rem;color:var(--ink2);line-height:1.8;margin-bottom:.3rem}
.art-quote{margin:2rem 0;padding:1.5rem 1.8rem;background:linear-gradient(135deg,var(--lavl),var(--bg));border-left:4px solid var(--lav);border-radius:0 12px 12px 0}
.art-quote p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.18rem;color:var(--ink);line-height:1.6;margin-bottom:.4rem!important}
.art-quote cite{font-style:normal;font-size:.8rem;color:var(--ink3)}
.art-tip{background:rgba(90,171,207,.06);border:1px solid rgba(90,171,207,.2);border-radius:12px;padding:1.2rem 1.5rem;margin:1.2rem 0}
.art-tip p{margin-bottom:0!important;font-size:.97rem}
.art-author{margin:2.5rem 0 0;padding:1.5rem;background:var(--bg2);border-radius:14px;display:flex;gap:1.2rem;align-items:flex-start}
.art-author-av{width:60px;height:60px;border-radius:50%;object-fit:cover;flex-shrink:0;border:3px solid white;box-shadow:var(--sh)}
.art-author-av-ph{width:60px;height:60px;border-radius:50%;background:linear-gradient(145deg,var(--skyl),var(--lavl));display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0}
.art-author-name{font-family:'Nunito',sans-serif;font-weight:800;font-size:.9rem;color:var(--ink);margin-bottom:.15rem}
.art-author-role{font-size:.75rem;color:var(--lav);font-weight:600;margin-bottom:.5rem}
.art-author-bio{font-size:.84rem;color:var(--ink2);line-height:1.65}
.art-cta{margin:2.5rem 0 0;padding:2rem;background:linear-gradient(145deg,var(--lavl),var(--narl));border-radius:14px;text-align:center}
.art-cta h3{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:700;color:var(--ink);margin-bottom:.5rem;line-height:1.2}
.art-cta p{font-size:.9rem;color:var(--ink2);margin-bottom:1.2rem}

/* CTA FINAL */
.blog-cta{text-align:center;padding:4rem;background:linear-gradient(145deg,var(--lavl),var(--bg));border-radius:20px;margin-top:4rem}
.blog-cta h3{font-family:'Cormorant Garamond',serif;font-size:clamp(1.6rem,3vw,2.2rem);font-weight:700;color:var(--ink);margin-bottom:.7rem}
.blog-cta p{font-size:.97rem;color:var(--ink2);line-height:1.75;max-width:500px;margin:0 auto 1.8rem}
.cta-btns{display:flex;gap:.9rem;justify-content:center;flex-wrap:wrap}

/* FOOTER */
footer{background:var(--ink);color:rgba(255,255,255,.5);padding:3rem 5% 0}
.foot-inner{max-width:1100px;margin:0 auto}
.foot-brand{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem}
.foot-logo{height:30px;width:auto}
.foot-name{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.1rem;letter-spacing:-.3px;color:white}
.fb1{color:var(--sky)}.fb2{color:var(--nar)}.fb3{color:var(--lav)}
.foot-tag{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.85rem;color:rgba(255,255,255,.33);margin-bottom:1.5rem}
.foot-links{display:flex;gap:1.5rem;flex-wrap:wrap;font-size:.82rem;color:rgba(255,255,255,.4);margin-bottom:1.5rem}
.foot-links a{transition:color .2s}
.foot-links a:hover{color:var(--sky)}
.foot-copy{font-size:.72rem;padding:1.2rem 0 2rem;border-top:1px solid rgba(255,255,255,.07)}

/* RESPONSIVE */
@media(max-width:900px){
  .bc-featured{grid-template-columns:1fr}
  .bc-featured .bcf-img{min-height:240px}
  .blog-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){
  .blog-grid{grid-template-columns:1fr}
  .art-content{padding:1.5rem 1.5rem 2rem}
  .art-author{flex-direction:column}
  .cta-btns{flex-direction:column;align-items:center}
  .bcf-body{padding:1.5rem}
  .bcf-body .bc-title{font-size:1.35rem}
}
</style>
