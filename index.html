<style>
/* TOKENS */
:root{
  --sky:#5AABCF;--skyl:#E8F5FB;
  --nar:#E8936A;--narl:#FBF0EB;
  --lav:#9B8EC4;--lavl:#EDEAFF;
  --ink:#1C1528;--ink2:#4A3F5C;--ink3:#8A7FA0;
  --bg:#FAF6F0;--bg2:#F2EDE3;--bg3:#EDE3D6;
  --r:14px;
  --sh:0 4px 24px rgba(28,21,40,.09);
  --sh2:0 16px 56px rgba(28,21,40,.18);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;line-height:1.6}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1160px;margin:0 auto;padding:0 5%}
.sec{padding:5.5rem 0}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
.btn{display:inline-flex;align-items:center;gap:.45rem;font-family:'Nunito',sans-serif;font-weight:800;font-size:.88rem;padding:.78rem 1.7rem;border-radius:50px;border:none;cursor:pointer;transition:transform .2s,background .2s;text-decoration:none}
.btn:hover{transform:translateY(-2px)}
.btn-p{background:var(--nar);color:#fff;box-shadow:0 6px 20px rgba(232,147,106,.35)}
.btn-p:hover{background:#d4783e}
.btn-s{background:transparent;color:var(--ink);border:2px solid rgba(28,21,40,.2)}
.btn-s:hover{border-color:var(--lav);color:var(--lav)}

/* WA FLOAT */
.wa-fab{position:fixed;bottom:1.5rem;right:1.5rem;z-index:900;width:56px;height:56px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(37,211,102,.5);cursor:pointer;text-decoration:none;animation:wap 2.5s ease-in-out infinite}
.wa-fab:hover{animation:none;transform:scale(1.1)}
.wa-fab svg{width:28px;height:28px;fill:white}
@keyframes wap{0%,100%{box-shadow:0 6px 24px rgba(37,211,102,.5)}50%{box-shadow:0 6px 40px rgba(37,211,102,.8)}}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:200;padding:.85rem 5%;display:flex;align-items:center;justify-content:space-between;transition:background .3s,box-shadow .3s}
.nav.solid{background:rgba(250,246,240,.97);backdrop-filter:blur(14px);box-shadow:0 2px 16px rgba(28,21,40,.08)}
.nav-brand{display:flex;align-items:center;gap:.52rem;cursor:pointer}
.nav-logo{height:34px;width:auto}
.nav-name{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.22rem;letter-spacing:-.4px;line-height:1;color:var(--ink)}
.nj1{color:var(--sky)}.nj2{color:var(--nar)}.nj3{color:var(--lav)}
.nav-tag{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.67rem;color:var(--ink3);line-height:1}
.nav-links{display:flex;gap:1.8rem;align-items:center}
.nav-links a{font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2);position:relative;transition:color .2s}
.nav-links a::after{content:'';position:absolute;bottom:-3px;left:0;right:0;height:1.5px;background:var(--nar);transform:scaleX(0);transform-origin:left;transition:transform .25s}
.nav-links a:hover{color:var(--ink)}
.nav-links a:hover::after{transform:scaleX(1)}
.nav-cta{background:var(--nar)!important;color:#fff!important;padding:.46rem 1.15rem;border-radius:50px;font-weight:800!important}
.nav-cta::after{display:none!important}
.nav-cta:hover{background:#d4783e!important}
.ham{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:.3rem;background:none;border:none}
.ham span{display:block;width:22px;height:2px;background:var(--ink);border-radius:2px;transition:transform .3s,opacity .3s}
.ham.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.ham.open span:nth-child(2){opacity:0}
.ham.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.drawer{display:none;position:fixed;inset:0;background:var(--bg);z-index:199;flex-direction:column;align-items:center;justify-content:center;gap:2rem}
.drawer.open{display:flex}
.drawer a{font-family:'Nunito',sans-serif;font-size:1.4rem;font-weight:800;color:var(--ink)}
.drawer a:hover{color:var(--nar)}

/* HERO */
.hero{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:center;padding:7rem 5% 4rem;background:linear-gradient(135deg,#EDE8FF 0%,var(--bg) 45%,#FBF0EB 100%);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-80px;right:-80px;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(155,142,196,.14) 0%,transparent 70%);pointer-events:none}
.hero::after{content:'';position:absolute;bottom:-60px;left:-60px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(232,147,106,.09) 0%,transparent 70%);pointer-events:none}
.hstar{position:absolute;animation:hfl 5s ease-in-out infinite;pointer-events:none;font-size:1.3rem}
.hs1{top:12%;left:5%}.hs2{top:22%;right:4%;font-size:1rem;animation-delay:-1.8s}.hs3{bottom:28%;left:3%;font-size:1.1rem;animation-delay:-3.3s}.hs4{bottom:18%;right:7%;animation-delay:-1.1s}
@keyframes hfl{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(12deg)}}
.hero-left{position:relative;z-index:1}
.hero-eye{display:inline-flex;align-items:center;gap:.4rem;font-size:.71rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--lav);margin-bottom:1.2rem}
.hero-eye::before{content:'âœ¦';font-size:.8rem}
.hero-h1{font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(2.4rem,5vw,3.8rem);line-height:1.1;letter-spacing:-1px;color:var(--ink);margin-bottom:1rem}
.hero-h1 em{font-style:italic;font-family:'Cormorant Garamond',serif;color:var(--lav);font-size:1.06em;text-decoration:underline;text-decoration-color:var(--nar);text-underline-offset:5px;font-weight:700}
.hero-sub{font-size:1rem;color:var(--ink2);line-height:1.75;max-width:430px;margin-bottom:2rem}
.hero-btns{display:flex;gap:.9rem;flex-wrap:wrap;margin-bottom:2.5rem}
.hero-trust{display:flex;gap:1.8rem;flex-wrap:wrap;font-size:.79rem;color:var(--ink3)}
.tdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lav);margin-right:.4rem;vertical-align:middle}
.hero-right{position:relative;z-index:1;height:500px;display:flex;align-items:center;justify-content:center}
.hero-book-wrap{position:relative;animation:bookglow 6s ease-in-out infinite}
@keyframes bookglow{
  0%,100%{transform:translateY(0) rotate(-1deg);filter:drop-shadow(0 24px 48px rgba(28,21,40,.22)) drop-shadow(0 0 30px rgba(155,142,196,.15))}
  50%{transform:translateY(-14px) rotate(0deg);filter:drop-shadow(0 32px 56px rgba(28,21,40,.28)) drop-shadow(0 0 50px rgba(155,142,196,.25))}}
.hero-book-img{width:auto;max-width:360px;max-height:460px;object-fit:contain;border-radius:8px;display:block}
.bpart{position:absolute;font-size:1.1rem;animation:partf 4s ease-in-out infinite;pointer-events:none}
.bp1{top:-10px;left:-20px}.bp2{top:20px;right:-25px;font-size:.9rem;animation-delay:-1.2s}.bp3{bottom:30px;left:-30px;animation-delay:-2.5s}.bp4{bottom:-5px;right:-15px;font-size:.85rem;animation-delay:-.8s}.bp5{top:50%;left:-40px;font-size:.8rem;animation-delay:-1.8s}
@keyframes partf{0%,100%{transform:translateY(0) scale(1);opacity:.8}50%{transform:translateY(-8px) scale(1.1);opacity:1}}
.fcard{position:absolute;background:white;border-radius:12px;padding:.62rem .9rem;box-shadow:var(--sh2);display:flex;align-items:center;gap:.5rem;white-space:nowrap;border:1px solid rgba(28,21,40,.04);animation:cfl 5s ease-in-out infinite}
.fc-ico{font-size:1.2rem;flex-shrink:0}
.fc-lbl{font-family:'Nunito',sans-serif;font-weight:800;font-size:.71rem;color:var(--ink);display:block;line-height:1.2}
.fc-sub{font-size:.61rem;color:var(--ink3);display:block;line-height:1.2;margin-top:.04rem}
.fc1{top:22px;left:-38px}.fc2{top:14px;right:-30px;animation-delay:-1.8s}.fc3{bottom:88px;left:-48px;animation-delay:-3.5s}.fc4{bottom:44px;right:-18px;animation-delay:-1.2s}
@keyframes cfl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* MEANING */
.meaning{background:var(--ink)}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:1.3rem;margin-top:3rem}
.mc{border:1px solid rgba(255,255,255,.08);border-radius:var(--r);padding:2rem 1.6rem;text-align:center;position:relative;overflow:hidden;transition:border-color .3s,transform .3s}
.mc:hover{border-color:rgba(255,255,255,.2);transform:translateY(-5px)}
.mc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.mc-sky::before{background:linear-gradient(90deg,var(--sky),#3A8FAF)}.mc-nar::before{background:linear-gradient(90deg,var(--nar),#c4623e)}.mc-lav::before{background:linear-gradient(90deg,var(--lav),#7B5EA7)}
.mc-let{font-family:'Nunito',sans-serif;font-weight:900;font-size:3.5rem;line-height:1;margin-bottom:.4rem}
.mc-sky .mc-let{color:var(--sky)}.mc-nar .mc-let{color:var(--nar)}.mc-lav .mc-let{color:var(--lav)}
.mc-word{font-family:'Nunito',sans-serif;font-weight:800;font-size:.9rem;color:rgba(255,255,255,.9);margin-bottom:.6rem}
.mc-desc{font-size:.84rem;color:rgba(255,255,255,.48);line-height:1.65}

/* PILARES */
.pillars{background:white}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}
.pc{border-radius:var(--r);padding:2rem 1.6rem;position:relative;overflow:hidden;border:1px solid var(--bg3);transition:transform .3s,box-shadow .3s}
.pc:hover{transform:translateY(-6px);box-shadow:var(--sh2)}
.pc::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--r) var(--r) 0 0}
.pc-sky{background:var(--skyl)}.pc-sky::before{background:linear-gradient(90deg,var(--sky),#3A8FAF)}
.pc-nar{background:var(--narl)}.pc-nar::before{background:linear-gradient(90deg,var(--nar),#c4623e)}
.pc-lav{background:var(--lavl)}.pc-lav::before{background:linear-gradient(90deg,var(--lav),#7B5EA7)}
.pc-ico{font-size:2rem;margin-bottom:.8rem;display:block}
.pc-title{font-family:'Nunito',sans-serif;font-weight:900;font-size:.97rem;color:var(--ink);margin-bottom:.45rem}
.pc-desc{font-size:.84rem;color:var(--ink2);line-height:1.65}
.pc-badge{display:inline-block;margin-top:.8rem;font-family:'Nunito',sans-serif;font-weight:700;font-size:.67rem;padding:.22rem .75rem;border-radius:50px}
.pc-sky .pc-badge{background:rgba(90,171,207,.15);color:var(--sky)}.pc-nar .pc-badge{background:rgba(232,147,106,.15);color:var(--nar)}.pc-lav .pc-badge{background:rgba(155,142,196,.15);color:var(--lav)}

/* HOW */
.how{background:var(--bg2)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;position:relative}
.steps::after{content:'';position:absolute;top:46px;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,var(--lav) 20%,var(--nar) 80%,transparent)}
.step{text-align:center;padding:0 .8rem;position:relative;z-index:1}
.step-circ{width:52px;height:52px;border-radius:50%;margin:0 auto 1.1rem;background:var(--bg);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;font-size:1.4rem;position:relative;transition:transform .3s}
.step:hover .step-circ{transform:scale(1.1)}
.step-n{position:absolute;top:-4px;right:-4px;width:19px;height:19px;border-radius:50%;background:var(--ink);color:var(--bg);font-family:'Nunito',sans-serif;font-weight:900;font-size:.58rem;display:flex;align-items:center;justify-content:center}
.step-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:.93rem;color:var(--ink);margin-bottom:.3rem}
.step-desc{font-size:.82rem;color:var(--ink3);line-height:1.55}

/* CATÃLOGO NETFLIX */
.catalog{background:var(--bg);padding:5.5rem 0 6rem}
.nx-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:2.8rem;gap:1rem;flex-wrap:wrap}
.nx-eyebrow{font-size:.67rem;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--nar);display:block;margin-bottom:.35rem}
.nx-head h2{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(1.9rem,3.5vw,2.8rem);line-height:1.1;color:var(--ink)}
.nx-head p{font-size:.93rem;color:var(--ink3);margin-top:.4rem;max-width:440px}
.nx-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1.1rem}
.nx-card{position:relative;border-radius:10px;overflow:hidden;cursor:pointer;aspect-ratio:3/4;background:var(--bg2);box-shadow:0 3px 16px rgba(28,21,40,.12);isolation:isolate;transition:transform .38s cubic-bezier(.15,.9,.3,1),box-shadow .38s ease}
.nx-card:hover{transform:translateY(-12px) scale(1.04);box-shadow:0 24px 56px rgba(28,21,40,.32),0 0 0 1.5px rgba(155,142,196,.4);z-index:10}
.nx-cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;display:block;transition:transform .5s ease}
.nx-card:hover .nx-cover{transform:scale(1.06)}
.nx-shade{position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom,transparent 42%,rgba(28,21,40,.5) 68%,rgba(28,21,40,.94) 100%)}
.nx-badge{position:absolute;top:9px;left:9px;z-index:3;font-family:'Nunito',sans-serif;font-weight:700;font-size:.58rem;letter-spacing:.9px;text-transform:uppercase;color:white;background:rgba(255,255,255,.15);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.28);padding:.2rem .6rem;border-radius:50px}
.nx-foot{position:absolute;bottom:0;left:0;right:0;z-index:2;padding:1.5rem .85rem .85rem}
.nx-card-title{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:.93rem;color:white;line-height:1.28;margin-bottom:.55rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nx-btns{display:flex;gap:.35rem;opacity:0;transform:translateY(8px);transition:opacity .22s ease,transform .22s ease;pointer-events:none}
.nx-card:hover .nx-btns{opacity:1;transform:translateY(0);pointer-events:auto}
.nx-btn-leer{flex:1;font-family:'Nunito',sans-serif;font-weight:800;font-size:.68rem;padding:.44rem .5rem;border-radius:50px;background:white;color:var(--ink);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.25rem;transition:background .18s,color .18s;white-space:nowrap}
